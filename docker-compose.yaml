version: '3.8'

services:
  web:
    build: .
    container_name: simpel_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - simpel_network

  db:
    image: mysql:5.7
    container_name: simpel_mysql
    restart: always
    environment:
      MYSQL_DATABASE: simpel
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: root
      MYSQL_PASSWORD: 123456
    # ports:
    #   - "3306:3306"
    volumes:
      - simpel_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - simpel_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: simpel_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 123456
    depends_on:
      - db
    networks:
      - simpel_network

volumes:
  simpel_mysql_data:

networks:
  simpel_network:
    driver: bridge